data:
  raw_path: "data/brut/ref-des-medicaments-cnops-2014.xlsx"
  train_path: "data/prepare/train.csv"
  test_path: "data/prepare/test.csv"
  test_size: 0.25
  random_state: 42

validation:
  f1_threshold: 0.75

model:
  selected_algorithm: "gradient_boosting"
  model_name: "medicament-generique"
  artifact_path: "models/model.joblib"

algorithms:
  gradient_boosting:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 3
    random_state: 42
  decision_tree:
    max_depth: 6
    random_state: 42
  knn:
    n_neighbors: 7
  logistic_regression:
    C: 1.0
    max_iter: 1000
    random_state: 42
  mlp:
    hidden_layer_sizes: [50, 25]
    max_iter: 500
    random_state: 42